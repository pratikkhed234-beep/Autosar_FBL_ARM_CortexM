name: AUTOSAR FBL CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f Host_Flashing_Tool/requirements.txt ]; then pip install -r Host_Flashing_Tool/requirements.txt; fi
          pip install python-can || true

      - name: Run UDS Diagnostic Validation Suite
        run: |
          python Host_Flashing_Tool/run_full_demo.py

      - name: Install ARM GNU Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi make

      - name: Compile ARM Cortex-M Bootloader
        run: |
          cd FBL_MCU_Project
          make all

      - name: Upload Bootloader Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: autosar-fbl-firmware
          path: |
            FBL_MCU_Project/build/autosar_fbl.bin
            FBL_MCU_Project/build/autosar_fbl.hex
            FBL_MCU_Project/build/autosar_fbl.elf
            FBL_MCU_Project/build/autosar_fbl.map
