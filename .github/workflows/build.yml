name: ARM Cortex-M Firmware CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install ARM GNU Toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi make

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Run UDS Reprogramming Verification
      run: |
        python Host_Flashing_Tool/run_full_demo.py

    - name: Build ARM Cortex-M Firmware
      run: |
        cd FBL_MCU_Project
        make all
